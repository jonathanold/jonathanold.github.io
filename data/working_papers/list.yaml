works:
- title: "Power-Sharing and Low-Level Conflict: Evidence from Political Reservations in India"
  pdflink: "/pdf/2026_Power_sharing_and_low_level_conflict.pdf"
  note: "[New draft coming soon!]"
  book: "Working Paper, available on request"
  coauthors:
  links:
    - url: "/audio/kalx-the-graduates-jonathan-old.mp3"
      text: "📻 Radio interview with KALX.FM"
  abstract: >
    This paper analyzes the effect of an important power-sharing institution — political
    reservations for historically disadvantaged minorities — on low-level subnational conflict
    in India. Previous research has identified positive impacts of reservations on public goods
    provision benefitting the targeted minorities. However, reservations may come at the
    detriment of other groups, leading to backlash and potentially higher conflict. I empirically
    investigate this question with panel data from Indian districts and assembly constituencies.
    Exploiting exogenous variation in reservations stemming from rules in the process of
    apportioning reserved seats, I show that reservations are consistently leading to lower
    levels of conflict. The combination of district- and constituency-level analysis shows that
    this is not a displacement effect, and that potential backlash at the district level is
    outweighed by direct conflict reduction. I explore mechanisms behind this result and show
    that (1) conflict reductions have been particularly pronounced for killings of security
    personnel, (2) conflict reductions have been stronger in areas with active Naxalite
    insurgent activity, and (3) conflict reductions were accompanied by reductions in
    caste-related conflict events and crimes against lower castes.
