works:
- title: "Screening for Collusion in Public Procurement: Evidence from 5 Million Auctions in India"
  pdflink: ""
  book: "Draft coming soon."
  coauthors:
  abstract: >
    Bidder collusion inflates the cost of public procurement, which accounts for close to a
    third of government spending in developing countries, yet its prevalence remains largely
    unmeasured where enforcement capacity is weak and prosecutions are rare. I detect collusion
    directly from bidding behavior using the near-universe of electronically tendered Indian
    public contracts, and build a pair-level screen that operationalizes the warning signals the
    Competition Commission of India instructs procuring officers to watch for. Collusive
    behavior is diffuse rather than concentrated in a few large cartels, and tenders in which a
    flagged pair wins while its partner also bids settle at higher prices relative to the
    government's engineering estimate than otherwise comparable tenders.
